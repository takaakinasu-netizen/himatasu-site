<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひまタス</title>
<style>
  :root {
    --bg: #FBFAF7;
    --text: #1a1a1a;
    --sub: #555;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --text: #eee;
      --sub: #aaa;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.9;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 25vh 24px 80px;
    text-align: center;
  }
  h1 {
    font-size: 32px;
    font-weight: 300;
    margin: 0 0 16px;
  }
  p {
    color: var(--sub);
    margin: 0 0 40px;
  }
  a {
    color: var(--sub);
    font-size: 14px;
  }
</style>
</head>
<body>
<main>
  <h1>ひまタス</h1>
  <p>何もしない時間を、ちょっと足そう。</p>
  <a href="./privacy.html">プライバシーポリシー</a>
</main>
</body>
</html>
