<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひまタス</title>
<style>
  :root {
    --bg: #FBFAF7;
    --text: #1a1a1a;
    --sub: #555;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --text: #eee;
      --sub: #aaa;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.9;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 25vh 24px 80px;
    text-align: center;
  }
  h1 {
    font-size: 32px;
    font-weight: 300;
    margin: 0 0 16px;
  }
  p {
    color: var(--sub);
    margin: 0 0 40px;
  }
  a {
    color: var(--sub);
    font-size: 14px;
  }
  .operator {
    margin-top: 72px;
    text-align: left;
    font-size: 14px;
    line-height: 1.7;
  }
  .operator h2 {
    font-size: 16px;
    font-weight: 400;
    margin: 0 0 16px;
    text-align: center;
  }
  .operator dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 8px 20px;
    margin: 0;
  }
  .operator dt {
    color: var(--sub);
  }
  .operator dd {
    margin: 0;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<main>
  <h1>ひまタス</h1>
  <p>何もしない時間を、ちょっと足そう。</p>
  <a href="./privacy.html">プライバシーポリシー</a>
  <section class="operator">
    <h2>運営者情報</h2>
    <dl>
      <dt>屋号</dt>
      <dd>KONAYA</dd>
      <dt>代表者</dt>
      <dd>那須 貴章</dd>
      <dt>所在地</dt>
      <dd>〒150-0043 東京都渋谷区道玄坂1丁目10番8号 渋谷道玄坂東急ビル2F-C</dd>
      <dt>事業内容</dt>
      <dd>ECコンサルティング、スマートフォンアプリの開発・販売</dd>
      <dt>お問い合わせ</dt>
      <dd><a href="mailto:support@konaya.app">support@konaya.app</a></dd>
    </dl>
  </section>
</main>
</body>
</html>
